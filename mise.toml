[tools]
node = "24.19.0"
bun = "1.3.14"

[tasks.dev]
description = "開発サーバーを起動"
dir = "packages/app"
run = "bun run dev"

[tasks.build]
description = "本番ビルド"
dir = "packages/app"
run = "bun run build"

[tasks.lint]
description = "oxlint を実行"
run = "bun run lint"

[tasks.format]
description = "oxfmt でフォーマット"
run = "bun run format"

[tasks."format:check"]
description = "oxfmt でフォーマットチェック"
run = "bun run format:check"

[tasks.preview]
description = "ビルド結果をプレビュー"
dir = "packages/app"
run = "bun run preview"

[tasks.test]
description = "vitest でテストを実行"
dir = "packages/app"
run = "bun run test"

[tasks."test:bun"]
description = "bun test でテストを実行"
dir = "packages/app"
run = "bun run test:bun"

[tasks."test:ui"]
description = "vitest UI を起動"
dir = "packages/app"
run = "bun run test:ui"

[tasks."test:coverage"]
description = "テストカバレッジを計測"
dir = "packages/app"
run = "bun run test:coverage"

[tasks.install]
description = "依存関係をインストール"
run = "bun install"

[tasks."build:wasm"]
description = "MoonBitコアをwasmでビルドしpackages/wasm-core/dist/にコピー"
dir = "packages/wasm-core"
run = """
moon build --target wasm --release
cp _build/wasm/release/build/aco_core.wasm dist/aco_core.wasm
"""

[settings]
experimental = true
minimum_release_age = "3d"
