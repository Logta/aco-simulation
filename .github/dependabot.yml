# Dependabot のバージョン更新設定。
# 脆弱性の修正(security updates)はリポジトリ設定側で有効にしてあり、
# このファイルは定期的な依存更新のためのもの。
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
